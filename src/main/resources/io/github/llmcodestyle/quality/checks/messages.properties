test.class.naming=Test class ''{0}'' must end in Test/SlowTest, or start with Test/Abstract.
util.class.wrong.package=Util class ''{0}'' in package ''{1}'' must be in a package ending with ''.utils''.
package.grouping.class.suffix=Class ''{0}'' shares suffix ''{1}'' with {2} siblings; the package mixes them with other non-POJO classes — move all ''*{1}'' types into a dedicated subpackage ''{3}''.
unused.private.member=Private member ''{0}'' is never referenced in this file \u2014 remove or use it.
test.method.name.camel.case=Test method ''{0}'' must use camelCase \u2014 no underscores.
long.test.literal=String literal ({0} chars) exceeds {1} char limit \u2014 extract to test resource file.
public.method.not.tested=Public method ''{0}'' is not called from the corresponding test class \u2014 add test coverage.
test.only.delegate=Method ''{0}'' is a thin delegate to private method ''{1}'' — make ''{1}'' package-private instead.
repeated.exception.wrapping=Catch-and-rethrow pattern repeated {0} times in this class \u2014 extract into a utility method.
duplicate.regex.constant=Regex constant ''{0}'' duplicates ''{1}'' in {2} \u2014 extract to a shared utility class.
spring.boot.main.not.public=@SpringBootApplication class ''{0}'' has main method that is not public \u2014 Spring Boot will fail to start.
spring.boot.main.not.static=@SpringBootApplication class ''{0}'' has main method that is not static \u2014 JVM bootstrap requires public static void main(String[]).
spring.boot.main.missing=@SpringBootApplication class ''{0}'' is missing public static void main(String[]) \u2014 Spring Boot needs an entry point.
unrelated.nested.record=Nested record ''{0}'' does not reference its enclosing type \u2014 move it to a pojos package for reuse and discoverability.
unrelated.nested.enum=Nested enum ''{0}'' does not reference its enclosing type \u2014 move it to an enums package for reuse and discoverability.
unrelated.nested.class=Nested class ''{0}'' does not reference its enclosing type \u2014 extract to a top-level class for reuse and discoverability.
unrelated.nested.interface=Nested interface ''{0}'' does not reference its enclosing type \u2014 extract to a top-level interface for reuse and discoverability.
method.may.be.static=Method ''{0}'' never references this/super or any instance member \u2014 add the static modifier.
util.class.must.end.in.util=Class ''{0}'' has only static methods and at least one is public \u2014 rename it to *Util / *Utils.
constants.class.public.method=Class ''{0}'' is named *Constants but declares a public method \u2014 constants holders must expose only public static final fields.
duplicate.method.body=Method ''{0}'' has a structurally identical body to ''{1}'' in ''{2}'' (after local/param renaming) \u2014 consolidate into a shared helper.
duplicate.method.body.extractable=Method ''{0}'' has a structurally identical body to ''{1}'' in ''{2}'' and neither uses instance state \u2014 extract into a shared utility class.
top.level.record.wrong.package=Top-level record ''{0}'' in package ''{1}'' must live in a package ending with ''{2}'' \u2014 move data carriers to a dedicated package.
top.level.enum.wrong.package=Top-level enum ''{0}'' in package ''{1}'' must live in a package ending with ''{2}'' \u2014 move value sets to a dedicated package.
explicit.null.return=Method ''{0}'' returns null explicitly \u2014 annotate with @Nullable (jakarta.annotation) or return Optional.
explicit.null.return.delegation=Method ''{0}'' delegates to @Nullable method ''{1}'' without null-safety \u2014 annotate with @Nullable or handle the null.
class.may.be.record=Class ''{0}'' has {1} private field(s) and no behavior \u2014 convert to a record.
missing.nullable.parameter=Parameter ''{0}'' in ''{1}'' is null-checked but not annotated @Nullable \u2014 add @Nullable (jakarta.annotation) to document the null contract.
missing.nullable.parameter.call=Null literal passed for parameter ''{0}'' of ''{1}'' which does not handle null \u2014 add @Nullable and null handling, or avoid passing null.
